<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>個人介紹</title>
  <style>
    /* 讓整個網頁可以一頁一頁「吸附」滑動 */
    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory; /* Y 軸（垂直）強制吸附 */
    }

    #page1 {
  position: relative;
  background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://raw.githubusercontent.com/Moshi20090527/hh/main/44e7132e6aeed1cb3c056cde3f8587a2.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
    }

    .icon {
     position: absolute;
     top:20%;
     right:10%;
      weight:150px;
      height:150px;
    }
    
    #page2 {
  background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://raw.githubusercontent.com/Moshi20090527/hh/main/44e7132e6aeed1cb3c056cde3f8587a2.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
    }

    .card{
      background-color: rgba(86,94,103,0.7);
      border:15px solid #2c2c2c;
      border-radius:16px;
      padding: 20px;
      margin: 15px auto;
      max-wdith: 90%;
    }
      
    body {
      margin: 0;
      background-color: #2894FF;
      font-family: Mona Sans;
      color: white;
    }

    /* 設定每一頁都是滿畫面 (100vh 代表螢幕 100% 高度) */
    .section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      scroll-snap-align: start; /* 滾動到這裡時自動吸附對齊 */
      text-align: center;
    }

    /* 圖片等比縮小與美化 */
    .round-img {
      width: 400px;
      height: 400px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* 提示往上滑的小箭頭動畫 */
    .scroll-hint {
      margin-top: 30px;
      font-size: 20px;
      opacity: 0.8;
      animation: bounce 1.5s infinite; /* 讓箭頭上下跳動 */
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- 第一頁：迎賓解鎖畫面 -->
  <div class="section" id="page1">
    <img class="round-img" src="b5c4cd75f1cb4335c503eac76c4efd73.jpg" >
    <img class="icon" src="92798b4704d7b6659fbee5840a35abd9.png">
    <h1>hello, I'm Leilani</h1>
    <p style="font-size:35px;">welcome to my Self-introduction</p>
    <div class="scroll-hint">往上滑動解鎖更多內容 ⬇️</div>
  </div>

  <!-- 第二頁：內部主要內容 -->
  <div class="section" id="page2">
    <p class="card" style="font-size:50px;">about me</p>
  </div>

</body>
</html>
